[project]
name = "quantum-pomdp"
version = "0.1.0"
description = "Quantum-Enhanced POMDP Belief State Estimation for autonomous systems"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Neura Parse Ltd" }]
readme = "../../README.md"

dependencies = [
    "quantum-common",
]

[tool.uv.sources]
quantum-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_pomdp"]
