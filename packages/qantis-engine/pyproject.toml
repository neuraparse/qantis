[project]
name = "qantis-engine"
version = "0.1.0"
description = "QANTIS Decision Engine: stochastic-decision inference + risk + constraint-native optimization + verification"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "quantum-common",
    "quantum-pomdp",
    "quantum-mht",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
]

[tool.uv.sources]
quantum-common = { workspace = true }
quantum-pomdp = { workspace = true }
quantum-mht = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qantis_engine"]
