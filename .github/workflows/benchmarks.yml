# Nightly benchmark regression
name: Benchmarks

on:
  schedule:
    - cron: "0 2 * * *"  # Every day at 2:00 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5"

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run POMDP benchmarks (simulators)
        run: |
          uv run python scripts/run_experiment.py \
            --config configs/experiments/pomdp_default.yaml \
            --dry-run

      - name: Run MHT benchmarks (simulators)
        run: |
          uv run python scripts/run_experiment.py \
            --config configs/experiments/mht_default.yaml \
            --dry-run

      - name: Run pytest-benchmark suite
        run: |
          uv run pytest packages/ \
            -m "benchmark" \
            --benchmark-json=benchmark_results.json \
            --benchmark-min-rounds=3 \
            || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmark_results.json
            results/
